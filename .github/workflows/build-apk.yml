name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick librsvg2-bin
          command -v convert > /dev/null || sudo ln -s "$(command -v magick)" /usr/local/bin/convert
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          SM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SM --licenses > /dev/null || true
          $SM "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Создать проект приложения
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -e
          P=android
          mkdir -p $P/app/src/main/java/app/luxmax/tracker $P/app/src/main/res/values
          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "tracker"
          include ':app'
          EOF
          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF
          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'app.luxmax.tracker'
            compileSdk 34
            defaultConfig {
              applicationId 'app.arqon.tracker'
              minSdk 24
              targetSdk 34
              versionCode ${{ github.run_number }}
              versionName '${{ github.run_number }}'
            }
            signingConfigs {
              release {
                storeFile file('../release.keystore')
                storePassword 'luxmax-tracker'
                keyAlias 'tracker'
                keyPassword 'luxmax-tracker'
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:label="ARQON"
              android:icon="@mipmap/ic_launcher"
              android:allowBackup="true"
              android:usesCleartextTraffic="false"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > $P/app/src/main/java/app/luxmax/tracker/MainActivity.java <<'EOF'
          package app.luxmax.tracker;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            static final String URL = "https://cascada77husle.github.io/luxmax-tracker/tracker_2.html";
            WebView web;

            @Override
            protected void onCreate(Bundle state) {
              super.onCreate(state);
              int bg = Color.parseColor("#0b0c10");
              getWindow().setStatusBarColor(bg);
              getWindow().setNavigationBarColor(bg);
              web = new WebView(this);
              web.setBackgroundColor(bg);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setUserAgentString(s.getUserAgentString() + " ARQONApp/${{ github.run_number }}");
              web.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  String h = u.getHost() == null ? "" : u.getHost();
                  if (h.endsWith("github.io") || h.endsWith("sslip.io") || h.endsWith("telegram.org") || h.endsWith("googleapis.com") || h.endsWith("gstatic.com")) return false;
                  startActivity(new Intent(Intent.ACTION_VIEW, u));
                  return true;
                }
              });
              if (state != null) web.restoreState(state); else web.loadUrl(URL);
            }

            @Override
            protected void onSaveInstanceState(Bundle out) {
              super.onSaveInstanceState(out);
              web.saveState(out);
            }

            @Override
            public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; sz=${pair##*:}
            mkdir -p $P/app/src/main/res/mipmap-$d
            convert icon-512.png -resize ${sz}x${sz} $P/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $P/release.keystore
          else
            keytool -genkeypair -v -keystore $P/release.keystore -alias tracker -keyalg RSA -keysize 2048 -validity 10000 -storepass luxmax-tracker -keypass luxmax-tracker -dname "CN=ARQON, O=ARQON, C=RU"
          fi

      - name: Собрать APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Выложить APK в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk tracker.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest tracker.apk --title "Приложение ARQON для Android" --notes "Установочный файл ARQON для Android (APK). Скачать tracker.apk и открыть на телефоне." --latest=false

      - name: Обновить иконки и номер версии в репозитории
        run: |
          echo '{"versionCode": ${{ github.run_number }}, "apk": "https://github.com/cascada77husle/luxmax-tracker/releases/download/apk-latest/tracker.apk"}' > app-version.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add icon-192.png icon-512.png app-version.json
          git commit -m "Обновить иконки и версию приложения" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
