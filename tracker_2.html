<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>LUXMAX CORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#FBFCFE;
    --border:#E4E8F0; --border-strong:#D7DCE6;
    --ink:#151B2B; --muted:#6B7484; --muted-2:#98A1B0;
    --accent:#2F6FED; --accent-ink:#1D4ED8; --accent-soft:#EAF1FE;
    --track:#E4E8F0;
    --good:#1E9E6B; --good-soft:#E7F7F0;
    --warn:#C97A16; --warn-soft:#FBF1E1;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -14px rgba(16,24,40,.14);
    --r-lg:20px; --r-md:14px; --r-sm:9px;
    --font-d:'Archivo',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1420; --surface:#161C2C; --surface-2:#1B2233;
      --border:#28304A; --border-strong:#343E5C;
      --ink:#EEF1F8; --muted:#9AA3B8; --muted-2:#6E7690;
      --accent:#5C8DFF; --accent-ink:#8FB0FF; --accent-soft:#1C2947;
      --track:#26304A;
      --good:#33C98C; --good-soft:#102A1E;
      --warn:#E3A24C; --warn-soft:#332108;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px -14px rgba(0,0,0,.65);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1420; --surface:#161C2C; --surface-2:#1B2233;
    --border:#28304A; --border-strong:#343E5C;
    --ink:#EEF1F8; --muted:#9AA3B8; --muted-2:#6E7690;
    --accent:#5C8DFF; --accent-ink:#8FB0FF; --accent-soft:#1C2947;
    --track:#26304A;
    --good:#33C98C; --good-soft:#102A1E;
    --warn:#E3A24C; --warn-soft:#332108;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px -14px rgba(0,0,0,.65);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent-soft);}
  button,input,textarea{font-family:inherit;}

  .shell{max-width:1180px;margin:0 auto;padding:0 20px 64px;}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:19px;height:19px;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text b{font-family:var(--font-d);font-weight:800;font-size:15px;letter-spacing:.01em;}
  .brand-text span{font-size:11px;color:var(--muted-2);letter-spacing:.04em;text-transform:uppercase;}

  .tabs{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
  .tab-btn{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s;}
  .tab-btn[aria-selected="true"]{background:var(--accent);color:#fff;}
  .tab-btn:not([aria-selected="true"]):hover{color:var(--ink);}
  .tab-btn.tab-btn--locked{opacity:.4;}
  .tab-btn.tab-btn--locked:hover{color:var(--muted);}

  .start-field{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .start-field input{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:7px 10px;font-size:13px;font-weight:600;}
  .start-field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  /* ---------- generic ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 14px;}
  .section-head h2{font-family:var(--font-d);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .section-head .hint{font-size:12.5px;color:var(--muted-2);}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);}
  .pill.on{background:var(--good-soft);color:var(--good);border-color:transparent;}
  .pill.accent{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;}

  .btn:focus-visible, .tab-btn:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  /* ================= DASHBOARD ================= */
  .dash-hero{display:grid;grid-template-columns:auto 1fr;gap:32px;padding:28px 30px;align-items:center;}
  @media (max-width:720px){.dash-hero{grid-template-columns:1fr;justify-items:center;text-align:center;}}
  .hero-ring{position:relative;flex-shrink:0;}
  .hero-ring text.big{font-family:var(--font-d);font-weight:800;}
  .hero-copy .eyebrow{margin-bottom:6px;display:block;}
  .hero-copy h1{font-family:var(--font-d);font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  .hero-copy p{margin:0;color:var(--muted);font-size:14px;max-width:46ch;}
  .hero-stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap;}
  .hero-stat b{font-family:var(--font-d);font-size:20px;font-weight:700;display:block;}
  .hero-stat span{font-size:11.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em;}

  .period-switch{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;margin-left:auto;}
  .period-switch button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;}
  .period-switch button[aria-selected="true"]{background:var(--ink);color:var(--bg);}

  .ring-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:900px){.ring-grid{grid-template-columns:repeat(2,1fr);}}
  .ring-tile{padding:20px 14px;text-align:center;}
  .ring-tile .ring-wrap{display:flex;justify-content:center;margin-bottom:10px;}
  .ring-tile .label{font-size:12.5px;font-weight:600;color:var(--muted);}

  /* trend / dynamics */
  .trend-card{padding:20px 22px 22px;}
  .trend-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .trend-tab{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;}
  .trend-tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent);}
  .trend-body{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;}
  @media (max-width:720px){.trend-body{grid-template-columns:1fr;}}
  .trend-chart-wrap{overflow-x:auto;}
  .trend-delta{text-align:center;padding:14px 20px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);min-width:150px;}
  .trend-delta .big-num{font-family:var(--font-d);font-size:24px;font-weight:800;}
  .trend-delta .big-num.up{color:var(--good);}
  .trend-delta .big-num.down{color:var(--warn);}
  .trend-delta .cap{font-size:11.5px;color:var(--muted-2);margin-top:4px;line-height:1.4;}

  .insight-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:900px){.insight-grid{grid-template-columns:repeat(2,1fr);}}
  .insight-tile{padding:16px 18px;}
  .insight-tile .eyebrow{color:var(--muted-2);}
  .insight-tile .val{font-family:var(--font-d);font-size:22px;font-weight:800;margin-top:6px;}
  .insight-tile .sub{font-size:12px;color:var(--muted-2);margin-top:2px;}

  .heat-wrap{padding:22px;}
  .heat-grid{display:grid;grid-template-columns:repeat(17,1fr);gap:4px;}
  .heat-cell{aspect-ratio:1;border-radius:4px;background:var(--track);cursor:pointer;position:relative;border:0;padding:0;}
  .heat-cell[data-current="true"]{box-shadow:0 0 0 2px var(--accent);}
  .heat-legend{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:11.5px;color:var(--muted-2);flex-wrap:wrap;}
  .heat-legend .sw{width:11px;height:11px;border-radius:3px;}

  .table-card{padding:6px 22px 18px;}
  table.metrics{width:100%;border-collapse:collapse;font-size:13px;}
  table.metrics th{text-align:left;color:var(--muted-2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:14px 8px 10px;border-bottom:1px solid var(--border);}
  table.metrics th:not(:first-child){text-align:right;}
  table.metrics td{padding:11px 8px;border-bottom:1px solid var(--border);}
  table.metrics td:not(:first-child){text-align:right;font-weight:600;}
  table.metrics tr:last-child td{border-bottom:0;}
  table.metrics td.muted{color:var(--muted-2);font-weight:400;}

  /* ================= DAY CARD ================= */
  .day-switcher{display:flex;align-items:center;gap:14px;padding:18px 22px;flex-wrap:wrap;}
  .day-nav-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .day-nav-btn:hover{border-color:var(--accent);color:var(--accent-ink);}
  .day-nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  .day-slider{flex:1;min-width:160px;accent-color:var(--accent);}
  .day-id{font-family:var(--font-d);font-weight:800;font-size:18px;white-space:nowrap;}
  .day-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;}

  .quick-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  @media (max-width:820px){.quick-row{grid-template-columns:repeat(2,1fr);}}
  .quick-field{padding:14px;text-align:left;}
  .quick-field label{display:block;font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .quick-field .input-row{display:flex;align-items:baseline;gap:5px;}
  .quick-field input[type=number]{width:100%;border:0;background:transparent;color:var(--ink);font-family:var(--font-d);font-size:22px;font-weight:800;padding:0;}
  .quick-field input[type=number]:focus-visible{outline:none;}
  .quick-field .unit{font-size:12px;color:var(--muted-2);}
  .quick-field .bar{margin-top:9px;height:5px;border-radius:99px;background:var(--track);overflow:hidden;}
  .quick-field .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s;}

  .group{padding:18px 20px 20px;}
  .group + .group{margin-top:14px;}
  .group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .group-title{font-family:var(--font-d);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;}
  .group-count{font-size:12px;color:var(--muted-2);font-weight:600;}
  .group-note{font-size:11.5px;color:var(--muted-2);margin:-8px 0 12px;}

  .check-item + .check-item{border-top:1px solid var(--border);}
  .check-row{display:flex;align-items:center;gap:12px;padding:10px 4px;}
  .check-row input[type=checkbox]{appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);background:var(--surface);flex-shrink:0;cursor:pointer;position:relative;transition:background .12s,border-color .12s;}
  .check-row input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);}
  .check-row input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .check-row label.txt{flex:1;font-size:13.5px;cursor:pointer;}
  .check-row label.txt b{display:block;font-weight:600;}
  .check-row label.txt span{display:block;font-size:12px;color:var(--muted-2);margin-top:1px;}
  .check-row.done label.txt b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .chevron-btn{border:0;background:transparent;color:var(--muted-2);cursor:pointer;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .18s,background .12s;}
  .chevron-btn:hover{background:var(--surface-2);color:var(--accent-ink);}
  .chevron-btn[aria-expanded="true"]{transform:rotate(180deg);background:var(--accent-soft);color:var(--accent-ink);}
  /* smooth accordion: grid-rows 0fr -> 1fr trick, no JS height measuring */
  .detail-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;}
  .detail-panel.open{grid-template-rows:1fr;}
  .detail-panel-inner{overflow:hidden;}
  .detail-panel-pad{padding:2px 4px 16px 46px;font-size:12.5px;color:var(--muted);line-height:1.6;}
  .detail-panel-pad b{color:var(--ink);}

  @keyframes checkPop{0%{transform:scale(1);}45%{transform:scale(1.2);}100%{transform:scale(1);}}
  .check-row input[type=checkbox]:checked{animation:checkPop .22s ease;}

  .cat-tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:5px;margin-right:7px;vertical-align:1px;}
  .check-row label.txt b .cat-tag{display:inline-block;}
  .acc-row{cursor:default;}
  .acc-row .txt{flex:1;}
  .acc-row .txt b{display:block;font-weight:600;font-size:13.5px;}
  .acc-row .txt span{display:block;font-size:12px;color:var(--muted-2);margin-top:1px;}

  .mode-switch{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
  .mode-switch button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:11.5px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s;}
  .mode-switch button[aria-selected="true"]{background:var(--ink);color:var(--bg);}

  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
  .chip:hover{border-color:var(--accent);}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .conditions-field{margin-top:16px;}
  .conditions-field label{display:block;font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .conditions-field textarea{width:100%;min-height:56px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--font-b);font-size:13px;resize:vertical;}

  /* ---------- Check-Up ---------- */
  .checkup-shell{max-width:760px;margin:0 auto;}
  .checkup-intro{padding:28px 30px;margin-bottom:28px;}
  .checkup-intro h1{font-family:var(--font-d);font-size:22px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em;}
  .checkup-intro p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6;max-width:60ch;}
  .checkup-step{padding:22px 24px 24px;margin-bottom:16px;}
  .checkup-step h3{font-family:var(--font-d);font-size:15px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .checkup-step .step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;flex-shrink:0;}
  .checkup-step .step-hint{font-size:12px;color:var(--muted-2);margin:0 0 16px 30px;}
  .rating-row{display:grid;grid-template-columns:140px 1fr 28px;align-items:center;gap:14px;padding:9px 0;}
  .rating-row label{font-size:13px;font-weight:600;}
  .rating-row input[type=range]{width:100%;accent-color:var(--accent);}
  .rating-row .rv{font-family:var(--font-d);font-weight:800;font-size:13px;text-align:right;}
  .seg-group{display:flex;flex-wrap:wrap;gap:6px;}
  .seg-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
  .seg-btn:hover{border-color:var(--accent);}
  .seg-btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);}
  .checkup-actions{display:flex;align-items:center;gap:12px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap;}
  .checkup-actions .hint{margin-right:auto;}
  .btn-primary{border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:13.5px;padding:12px 22px;border-radius:999px;cursor:pointer;transition:opacity .15s;}
  .btn-primary:hover{opacity:.88;}
  .btn-ghost{border:1px solid var(--border-strong);background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:10px 16px;border-radius:999px;cursor:pointer;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-ink);}
  .checkup-btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .checkup-btn:hover{border-color:var(--accent);color:var(--accent-ink);}
  .priority-note{font-size:12.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 14px;margin:-6px 0 18px;line-height:1.55;}
  .priority-tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--accent);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px;}
  .rest-note{padding:16px 18px;font-size:13px;color:var(--muted);line-height:1.55;}
  .rest-note b{color:var(--ink);}

  .supp-row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid var(--border);}
  .supp-row:last-child{border-bottom:0;}
  .supp-row .txt{font-size:13.5px;font-weight:600;}
  .toggle{position:relative;width:38px;height:22px;border-radius:99px;background:var(--track);border:0;cursor:pointer;flex-shrink:0;}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s;}
  .toggle[aria-pressed="true"]{background:var(--good);}
  .toggle[aria-pressed="true"]::after{transform:translateX(16px);}
  .toggle.accent[aria-pressed="true"]{background:var(--accent);}
  .toggle:disabled{opacity:.4;cursor:not-allowed;}
  .toggle-label{font-size:11px;color:var(--muted-2);font-weight:600;width:70px;text-align:right;}

  .notes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:820px){.notes-grid{grid-template-columns:1fr;}}
  .notes-grid textarea{width:100%;min-height:74px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--font-b);font-size:13px;resize:vertical;}
  .notes-grid label{display:block;font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:820px){.info-grid{grid-template-columns:1fr;}}
  .info-card{padding:18px 20px;}
  .info-card .eyebrow{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
  .info-card p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink);}
  .info-card p.muted{color:var(--muted);font-size:12.5px;margin-top:6px;}

  .score-strip{display:flex;align-items:center;gap:16px;padding:16px 20px;}
  .score-strip .ring-wrap{flex-shrink:0;}

const TOTAL_DAYS = 51;
const STORE_KEY = "luxmax_core_v4";

const PHASES = [
  {from:1,  to:6,  name:"Диагностика и база"},
  {from:7,  to:13, name:"Осанка и шея"},
  {from:14, to:20, name:"Челюсть"},
  {from:21, to:27, name:"Скулы"},
  {from:28, to:34, name:"Взгляд и отёчность"},
  {from:35, to:44, name:"Full Looksmax"},
  {from:45, to:49, name:"Автоматизация"},
  {from:50, to:51, name:"Реассессмент"},
];
function phaseOf(day){ return PHASES.find(p=>day>=p.from&&day<=p.to)||PHASES[0]; }
function nextPhaseLabel(day){
  if(day>=TOTAL_DAYS) return null;
  const cur = phaseOf(day), nxt = phaseOf(day+1);
  return nxt.name!==cur.name ? nxt.name : null;
}

function poolByZone(zoneKey){ return LUXMAX_POOL.filter(x=>x.cat===zoneKey); }
function exercisesForDay(day){
  const priority = STATE.checkupDone ? priorityZoneList() : [];
  const picks = LUXMAX_ZONES.map((z,zi)=>{
    const items = poolByZone(z.key);
    const idx = (day-1+zi) % items.length;
    return Object.assign({}, items[idx], {zone:z.key, bonus:false});
  });
  const BONUS_BUDGET = 3;
  let used = 0;
  for(const zoneKey of priority){
    if(used>=BONUS_BUDGET) break;
    const zi = LUXMAX_ZONES.findIndex(z=>z.key===zoneKey);
    const items = poolByZone(zoneKey);
    if(items.length<2) continue;
    const baseIdx = (day-1+zi) % items.length;
    const idx2 = (day-1+zi+Math.ceil(items.length/2)) % items.length;
    if(idx2===baseIdx) continue;
    picks.push(Object.assign({}, items[idx2], {zone:zoneKey, bonus:true}));
    used++;
  }
  return picks;
}

const FOCUS_TO_SPLIT = {chest:"push", shoulders:"push", arms:"push", back:"pull", legs:"legs", core:"legs", cardio:"push"};
function dayOfWeekIdx(day){ return (day-1)%7; }
function trainingFreq(){ return (STATE.checkupDone && STATE.checkup.training.freq) || "b23"; }
function isTrainingDay(day){
  if(!STATE.checkupDone) return true; // pre-checkup default: a block every day, as before
  const pattern = FREQ_PATTERN[trainingFreq()] || FREQ_PATTERN.b23;
  return pattern.includes(dayOfWeekIdx(day));
}
function trainingDayIndexUpTo(day){
  let c=0; for(let n=1;n<=day;n++){ if(isTrainingDay(n)) c++; } return c;
}
function weightedSplitSequence(){
  const focus = (STATE.checkupDone && STATE.checkup.training.focus) || {};
  const w = {push:1,pull:1,legs:1};
  Object.keys(focus).forEach(k=>{ if(focus[k] && FOCUS_TO_SPLIT[k]) w[FOCUS_TO_SPLIT[k]] += 1; });
  const seq=[]; ["push","pull","legs"].forEach(k=>{ for(let i=0;i<w[k];i++) seq.push(k); });
  return seq;
}
function gymSplitForDay(day){
  if(STATE.checkupDone && trainingFreq()==="b01") return FULLBODY_GYM;
  const idx = trainingDayIndexUpTo(day) || 1;
  const seq = weightedSplitSequence();
  const key = seq[(idx-1)%seq.length];
  return GYM_SPLIT.find(s=>s.key===key);
}
function trainingPlace(){ return STATE.checkupDone ? STATE.checkup.training.place : (STATE.trainingModeLegacy||"home"); }
function strengthForDay(day){
  if(!isTrainingDay(day)) return [];
  if(trainingPlace()==="gym") return gymSplitForDay(day).items;
  const start = ((day-1)*3) % STRENGTH_POOL.length;
  const out=[];
  for(let i=0;i<3;i++) out.push(STRENGTH_POOL[(start+i)%STRENGTH_POOL.length]);
  return out;
}

/* priority zones = low rating (<7) on that zone's key, plus +3 for each selected goal tied to that zone */
function priorityZoneList(){
  if(!STATE.checkupDone) return [];
  const r = STATE.checkup.ratings, goals = STATE.checkup.goals;
  const score = {jaw:0,cheeks:0,neck:0,puff:0,eyes:0,forehead:0,lips:0};
  const addRating = (zone,key)=>{ score[zone] += Math.max(0, 7-(r[key]??7)); };
  addRating("jaw","jaw"); addRating("cheeks","cheeks"); addRating("neck","neck"); addRating("puff","puff"); addRating("eyes","puff");
  addRating("forehead","forehead"); addRating("lips","lips");
  CHECKUP_GOALS.forEach(g=>{ if(goals[g.id] && g.zone) score[g.zone] += 3; });
  return Object.entries(score).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
}
function selectedGoals(){ return STATE.checkupDone ? CHECKUP_GOALS.filter(g=>STATE.checkup.goals[g.id]) : []; }

  if(g.skin || g.brows || g.hair) lines.push("омега-3, коллаген, витамин D3");

/* ---------- cloud sync (Telegram CloudStorage) ----------
   localStorage above is per-device and is always the fast path used for
   render. CloudStorage additionally mirrors the same data to the user's
   Telegram account, so progress survives a reinstall or opening the app
   on a different device. Everything here is a no-op outside Telegram
   (plain browser / Artifact preview) since window.Telegram is absent. */
const CLOUD_CHUNK_SIZE = 3500; // stay under Telegram's 4096-char-per-value limit
const CLOUD_META_KEY = STORE_KEY + "_meta";
function getTg(){ try{ return window.Telegram && window.Telegram.WebApp; }catch(e){ return null; } }
function cloudSave(str){
  const tg = getTg();
  if(!tg || !tg.CloudStorage || !tg.CloudStorage.setItem) return;
  try{
    const chunks = [];
    for(let i=0;i<str.length;i+=CLOUD_CHUNK_SIZE) chunks.push(str.slice(i, i+CLOUD_CHUNK_SIZE));
    tg.CloudStorage.setItem(CLOUD_META_KEY, String(chunks.length), function(){});
    chunks.forEach((chunk, idx)=>{ tg.CloudStorage.setItem(STORE_KEY+"_c"+idx, chunk, function(){}); });
  }catch(e){ console.warn('CloudStorage save skipped:', e); }
}
function cloudLoad(callback){
  const tg = getTg();
  if(!tg || !tg.CloudStorage || !tg.CloudStorage.getItem){ callback(null); return; }
  try{
    tg.CloudStorage.getItem(CLOUD_META_KEY, function(err, metaVal){
      if(err || !metaVal){ callback(null); return; }
      const count = parseInt(metaVal, 10);
      if(!count || count<1){ callback(null); return; }
      const keys = []; for(let i=0;i<count;i++) keys.push(STORE_KEY+"_c"+i);
      tg.CloudStorage.getItems(keys, function(err2, items){
        if(err2 || !items){ callback(null); return; }
        try{ callback(keys.map(k=>items[k]||"").join("")); }catch(e){ callback(null); }
      });
    });
  }catch(e){ callback(null); }
}
/* Called once at Telegram init: if the cloud copy is newer than what's on
   this device, adopt it and re-render. Safe to skip — worst case the
   device keeps its own local progress. */
function hydrateFromCloud(){
  cloudLoad(function(str){
    if(!str) return;
    try{
      const cloudState = mergeIntoState(JSON.parse(str));
      if((cloudState.updatedAt||0) > (STATE.updatedAt||0)){
        STATE = cloudState;
        localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
        periodMetricsCache = null;
        const si = document.getElementById("startDateInput");
        if(si) si.value = STATE.startDate||"";
        switchTab(STATE.checkupDone ? "dash" : "checkup");
      }
    }catch(e){ /* ignore malformed cloud data */ }
  });
}

/* ---------- scoring ---------- */
function ratioList(obj, list){ if(!list.length) return 0; return list.filter(i=>obj[i.id]).length/list.length; }
function dayScore(n){
  const d = STATE.days[n];
  if(!d) return 0;
  const discipline = ratioList(d.ex, exercisesForDay(n))*20;
  const nutrition  = ratioList(d.nu, [{id:"n1"},{id:"n2"},{id:"n3"}])*20;
  const stList = strengthForDay(n);
  const strength   = (stList.length? ratioList(d.st, stList) : 1)*15; // rest day: full credit, nothing was scheduled
  const recovery   = (d.recovery!=null? d.recovery/10:0)*15;
  const energy     = (d.energy!=null? d.energy/10:0)*10;
  const mood       = (d.mood!=null? d.mood/10:0)*5;
  const habitsParts = [
    d.sleep!=null && d.sleep>=7,
    d.water!=null && d.water>=2,
    ratioList(d.care, CARE)>=0.66,
  ];
  const habits = (habitsParts.filter(Boolean).length/habitsParts.length)*15;
  return Math.round(discipline+nutrition+strength+recovery+energy+mood+habits);
}
function daysWithData(){ return Array.from({length:TOTAL_DAYS},(_,i)=>i+1).filter(hasEntry); }
function currentStreak(){
  let n = STATE.currentDay, streak=0;
  while(n>=1 && hasEntry(n) && dayScore(n)>=50){ streak++; n--; }
  return streak;
}
function bestStreak(){
  let best=0, cur=0;
  for(let n=1;n<=TOTAL_DAYS;n++){
    if(hasEntry(n) && dayScore(n)>=50){ cur++; best=Math.max(best,cur); } else cur=0;
  }
  return best;
}

/* ============================== SVG RING ============================== */
function ringSVG(pct, size, stroke, opts){
  opts = opts||{};
  pct = Math.max(0, Math.min(100, pct));
  const r = (size-stroke)/2, c = size/2, circ = 2*Math.PI*r;
  const dash = circ*pct/100;
  const label = opts.label!==undefined ? opts.label : Math.round(pct)+"%";
  const fs = opts.fontSize || Math.round(size*0.22);
  const color = pct>0 ? "var(--accent)" : "var(--track)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${label}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${dash} ${circ}" transform="rotate(-90 ${c} ${c})"
      style="transition:stroke-dasharray .3s"/>
    <text x="${c}" y="${c}" text-anchor="middle" dominant-baseline="central" class="big"
      font-size="${fs}" fill="var(--ink)">${label}</text>
  </svg>`;
}

let dashPeriod = "day"; // day | week | month
let trendMetric = "energy"; // energy | water | sleep | strength

function periodDays(){
  const n = STATE.currentDay;
  if(dashPeriod==="day") return [n];
  if(dashPeriod==="week"){
    const weekIdx = Math.floor((n-1)/7);
    const from = weekIdx*7+1, to = Math.min(from+6, TOTAL_DAYS);
    const arr=[]; for(let i=from;i<=to;i++) arr.push(i);
    return arr;
  }
  const arr=[]; for(let i=1;i<=n;i++) arr.push(i);
  return arr;
}
function periodLabel(){
  if(dashPeriod==="day") return "День "+STATE.currentDay;
  if(dashPeriod==="week"){
    const weekIdx = Math.floor((STATE.currentDay-1)/7);
    return "Неделя "+(weekIdx+1);
  }
  return "С начала по день "+STATE.currentDay;
}
function avgOver(days, pick){
  const vals = days.map(pick).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function periodMetrics(days){
  const dayObjs = days.map(n=>STATE.days[n]).filter(Boolean);
  const logged = days.filter(hasEntry);
  const avgScore = logged.length ? Math.round(logged.reduce((a,n)=>a+dayScore(n),0)/logged.length) : 0;
  const disciplinePct = logged.length ? Math.round(logged.reduce((a,n)=>a+ratioList(STATE.days[n].ex,exercisesForDay(n)),0)/logged.length*100) : 0;
  const nutritionPct  = logged.length ? Math.round(logged.reduce((a,n)=>a+ratioList(STATE.days[n].nu,[{id:"n1"},{id:"n2"},{id:"n3"}]),0)/logged.length*100) : 0;
  const strengthPct   = logged.length ? Math.round(logged.reduce((a,n)=>{ const sl=strengthForDay(n); return a+(sl.length? ratioList(STATE.days[n].st,sl) : 1); },0)/logged.length*100) : 0;
  const recoveryAvg   = avgOver(dayObjs, d=>d.recovery);
  const recoveryPct   = recoveryAvg!=null ? Math.round(recoveryAvg*10) : 0;
  return {avgScore, disciplinePct, nutritionPct, strengthPct, recoveryPct, loggedCount:logged.length, totalCount:days.length};
}
let periodMetricsCache=null;
function overallSummary(){ return periodMetricsCache || (periodMetricsCache = periodMetrics(Array.from({length:TOTAL_DAYS},(_,i)=>i+1))); }
function declOfDay(n){
  const mod10=n%10, mod100=n%100;
  if(mod10===1 && mod100!==11) return "день";
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return "дня";
  return "дней";
}

const TREND_DEFS_BASE = {
  energy:   {label:"Энергия",   unit:"/10", pick:d=>d.energy},
  water:    {label:"Вода",      unit:"л",   pick:d=>d.water},

function getTrendDefs(){
  const defs = Object.assign({}, TREND_DEFS_BASE);
  if(STATE.checkupDone){
    priorityZoneList().slice(0,2).forEach(zk=>{
      const z = LUXMAX_ZONES.find(z=>z.key===zk);
      defs["zone:"+zk] = {label:z.label, unit:"%", zone:zk};
    });
  }
  return defs;
}
function zoneSeriesPoint(zoneKey, day){
  const d = STATE.days[day];
  if(!d) return null;
  const list = exercisesForDay(day).filter(e=>e.zone===zoneKey);
  if(!list.length) return null;
  return ratioList(d.ex, list)*100;
}
function trendSeries(key, defs){
  const def = defs[key];
  return daysWithData().map(n=>{
    let v;
    if(key==="strength"){ const sl=strengthForDay(n); v = sl.length? ratioList(STATE.days[n].st, sl)*100 : null; }
    else if(def.zone) v = zoneSeriesPoint(def.zone, n);
    else v = def.pick(STATE.days[n]);
    return {day:n, v};
  }).filter(p=>p.v!=null);
}

    return `<svg width="360" height="${h}" viewBox="0 0 360 ${h}"><text x="180" y="${h/2}" text-anchor="middle" fill="var(--muted-2)" font-size="13">Пока нет данных за этот период</text></svg>`;
  }
  const max = Math.max(...points.map(p=>p.v), 1);
  const bw = (w-pad*2)/points.length;
  let bars="", labels="";
  points.forEach((p,i)=>{
    const bh = Math.max(3,(p.v/max)*(h-pad*2));
    const x = pad + i*bw + bw*0.2;
    const y = h-pad-bh;
    bars += `<rect x="${x}" y="${y}" width="${bw*0.6}" height="${bh}" rx="3" fill="var(--accent)" opacity="${0.4+0.6*(i/(points.length-1||1))}"/>`;
    if(points.length<=18 || i%Math.ceil(points.length/18)===0){
      labels += `<text x="${x+bw*0.3}" y="${h-6}" text-anchor="middle" font-size="9" fill="var(--muted-2)">${p.day}</text>`;
    }
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Динамика: ${unit}">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}
function trendDeltaHTML(points, unit){
  if(points.length<4) return `<div class="big-num" style="color:var(--muted-2)">—</div><div class="cap">Нужно хотя бы 4 заполненных дня, чтобы сравнить</div>`;
  const mid = Math.floor(points.length/2);
  const firstAvg = points.slice(0,mid).reduce((a,p)=>a+p.v,0)/mid;
  const secondAvg = points.slice(mid).reduce((a,p)=>a+p.v,0)/(points.length-mid);
  const diff = secondAvg-firstAvg;
  const pct = firstAvg!==0 ? Math.round(diff/firstAvg*100) : (secondAvg>0?100:0);
  const up = diff>0.001, down = diff<-0.001;
  const cls = up?"up":down?"down":"";
  const arrow = up?"↑":down?"↓":"→";
  const text = up? "лучше, чем в начале" : down? "ниже, чем в начале" : "без изменений";
  return `<div class="big-num ${cls}">${arrow} ${Math.abs(pct)}%</div><div class="cap">${text}<br>${firstAvg.toFixed(1)}${unit} → ${secondAvg.toFixed(1)}${unit}</div>`;
}

  return `<div class="check-item">
    <div class="supp-row">
      <span class="txt">${s.name}${priority? `<span class="priority-tag">приоритет</span>`:""}</span>
      <span class="toggle-label">есть &nbsp; <button class="toggle" data-supp="${s.id}" aria-pressed="${owned}"></button></span>
      <span class="toggle-label">принял &nbsp; <button class="toggle accent" data-supp="${s.id}" aria-pressed="${taken}" ${owned?'':'disabled'}></button></span>
      <button class="chevron-btn" data-expand="supp_${s.id}" aria-expanded="false" aria-label="Почему это важно">▾</button>
    </div>
    <div class="detail-panel" id="detail_supp_${s.id}"><div class="detail-panel-inner"><div class="detail-panel-pad">${supplementDetailHTML(s)}</div></div></div>
  </div>`;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- Check-Up ---------- */
function renderCheckup(){
  const el = document.getElementById("view-checkup");
  const c = STATE.checkup;
  const editing = STATE.checkupDone;

  el.innerHTML = `
    <div class="checkup-shell">
      <div class="card checkup-intro">
        <h1>${editing? "Твой Check-Up" : "Персональный Check-Up"}</h1>
        <p>${editing? "Измени цели, оценки или тренировочные данные — твой протокол, набор метрик и Dashboard пересоберутся автоматически." : "Полторы минуты, чтобы собрать LUXMAX-протокол именно под тебя: отметь цели, оцени параметры внешности и укажи, как тренируешься."}</p>
      </div>

      <div class="card checkup-step">
        <h3><span class="step-num">1</span> Цели и проблемы</h3>
        <p class="step-hint">Отметь всё, что актуально — от этого зависит, какие блоки усиливаются в протоколе.</p>
        <div class="chip-grid">
          ${CHECKUP_GOALS.map(g=>`<button class="chip ${c.goals[g.id]?'active':''}" data-goal="${g.id}">${g.label}</button>`).join("")}
        </div>
      </div>

      <div class="card checkup-step">
        <h3><span class="step-num">2</span> Оцени параметры</h3>
        <p class="step-hint">1 — сильно беспокоит, 10 — полностью устраивает. Двигай ползунки как есть сейчас, без прикрас.</p>
        <div>
          ${RATING_KEYS.map(r=>`
            <div class="rating-row">
              <label>${r.label}</label>
              <input type="range" min="1" max="10" step="1" value="${c.ratings[r.key]}" data-rating="${r.key}">
              <span class="rv" id="rv_${r.key}">${c.ratings[r.key]}</span>
            </div>`).join("")}
        </div>
      </div>

      <div class="card checkup-step">
        <h3><span class="step-num">3</span> Тренировки</h3>
        <p class="step-hint">Место, частота, фокус и уровень — протокол подстроит силовой блок и сплит под это.</p>

        <div class="rating-row" style="grid-template-columns:140px 1fr;">
          <label>Место</label>
          <div class="seg-group">
            <button class="seg-btn" data-place="home" aria-pressed="${c.training.place!=='gym'}">Дома</button>
            <button class="seg-btn" data-place="gym" aria-pressed="${c.training.place==='gym'}">Зал</button>
          </div>
        </div>
        <div class="rating-row" style="grid-template-columns:140px 1fr;">
          <label>Частота</label>
          <div class="seg-group">
            ${Object.keys(FREQ_LABELS).map(k=>`<button class="seg-btn" data-freq="${k}" aria-pressed="${c.training.freq===k}">${FREQ_LABELS[k]}</button>`).join("")}
          </div>
        </div>
        <div class="rating-row" style="grid-template-columns:140px 1fr;align-items:start;">
          <label>Группы мышц</label>
          <div class="chip-grid">
            ${FOCUS_GROUPS.map(f=>`<button class="chip ${c.training.focus[f.id]?'active':''}" data-focus="${f.id}">${f.label}</button>`).join("")}
          </div>
        </div>
        <div class="rating-row" style="grid-template-columns:140px 1fr;">
          <label>Уровень</label>
          <div class="seg-group">
            ${Object.keys(LEVEL_LABELS).map(k=>`<button class="seg-btn" data-level="${k}" aria-pressed="${c.training.level===k}">${LEVEL_LABELS[k]}</button>`).join("")}
          </div>
        </div>
        <div class="rating-row" style="grid-template-columns:140px 1fr;">
          <label>Формат</label>
          <div class="seg-group">
            ${Object.keys(FORMAT_LABELS).map(k=>`<button class="seg-btn" data-format="${k}" aria-pressed="${c.training.format===k}">${FORMAT_LABELS[k]}</button>`).join("")}
          </div>
        </div>

        <div class="conditions-field">
          <label>Другое / особенности здоровья (если есть)</label>
          <textarea id="cuNote" placeholder="Например: проблемы с ВНЧС, аллергии, ограничения по нагрузке…">${escapeHtml(c.note)}</textarea>
        </div>
      </div>

      <div class="checkup-actions">
        <span class="hint">${editing? "Изменения сохраняются сразу." : "Все ответы можно изменить в любой момент позже."}</span>
        ${editing? `<button class="btn-ghost" id="cuBack">Назад к дашборду</button>`:""}
        <button class="btn-primary" id="cuSave">${editing? "Сохранить изменения" : "Сохранить Check-Up и собрать протокол"}</button>
      </div>
    </div>
  `;

  el.querySelectorAll("[data-goal]").forEach(chip=>chip.addEventListener("click",()=>{
    const id = chip.dataset.goal;
    STATE.checkup.goals[id] = !STATE.checkup.goals[id];
    saveState(); renderCheckup();
  }));
  el.querySelectorAll("[data-rating]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      STATE.checkup.ratings[inp.dataset.rating] = +inp.value;
      const rv = document.getElementById("rv_"+inp.dataset.rating);
      if(rv) rv.textContent = inp.value;
    });
    inp.addEventListener("change",()=>saveState());
  });
  el.querySelectorAll("[data-place]").forEach(b=>b.addEventListener("click",()=>{
    STATE.checkup.training.place = b.dataset.place; saveState(); renderCheckup();
  }));
  el.querySelectorAll("[data-freq]").forEach(b=>b.addEventListener("click",()=>{
    STATE.checkup.training.freq = b.dataset.freq; saveState(); renderCheckup();
  }));
  el.querySelectorAll("[data-focus]").forEach(chip=>chip.addEventListener("click",()=>{
    const id = chip.dataset.focus;
    STATE.checkup.training.focus[id] = !STATE.checkup.training.focus[id];
    saveState(); renderCheckup();
  }));
  el.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>{
    STATE.checkup.training.level = b.dataset.level; saveState(); renderCheckup();
  }));
  el.querySelectorAll("[data-format]").forEach(b=>b.addEventListener("click",()=>{
    STATE.checkup.training.format = b.dataset.format; saveState(); renderCheckup();
  }));
  document.getElementById("cuNote").addEventListener("input",e=>{ STATE.checkup.note = e.target.value; saveState(); });

  const backBtn = document.getElementById("cuBack");
  if(backBtn) backBtn.addEventListener("click",()=>switchTab("dash"));

  document.getElementById("cuSave").addEventListener("click",()=>{
    STATE.checkupDone = true; saveState(); switchTab("dash");
  });
}

/* ============================== TAB SWITCHING ============================== */
/* Дашборд и Карточка дня доступны только после прохождения Check-Up —
   до этого момента обе кнопки визуально притушены, а клик по ним просто
   возвращает пользователя на Check-Up вместо того, чтобы открыть пустой
   дашборд без данных. */
function applyTabLock(){
  const locked = !STATE.checkupDone;
  ["tab-dash","tab-day"].forEach(id=>{
    const b = document.getElementById(id);
    b.classList.toggle("tab-btn--locked", locked);
    b.setAttribute("aria-disabled", locked ? "true" : "false");
    b.title = locked ? "Сначала пройди Check-Up" : "";
  });
}
function switchTab(which){
  applyTabLock();
  if((which==="dash" || which==="day") && !STATE.checkupDone) which="checkup";
  document.getElementById("tab-dash").setAttribute("aria-selected", which==="dash");
  document.getElementById("tab-day").setAttribute("aria-selected", which==="day");
  document.getElementById("view-checkup").hidden = which!=="checkup";
  document.getElementById("view-dash").hidden = which!=="dash";
  document.getElementById("view-day").hidden = which!=="day";
  periodMetricsCache = null;
  if(which==="checkup") renderCheckup();
  else if(which==="dash") renderDash();
  else renderDay();
}
document.getElementById("tab-dash").addEventListener("click",()=>switchTab("dash"));
document.getElementById("tab-day").addEventListener("click",()=>switchTab("day"));
document.getElementById("openCheckup").addEventListener("click",()=>switchTab("checkup"));

const startInput = document.getElementById("startDateInput");
startInput.value = STATE.startDate||"";
startInput.addEventListener("change",()=>{
  STATE.startDate=startInput.value; saveState();
  const current = !document.getElementById("view-dash").hidden ? "dash" : (!document.getElementById("view-day").hidden ? "day" : "checkup");
  switchTab(current);
});

/* ============================== INIT ============================== */
switchTab(STATE.checkupDone ? "dash" : "checkup");
</script>

<script>
/* ---- Telegram Mini App integration (progressive enhancement, safe outside Telegram) ---- */
(function(){
  try{
    var tg = window.Telegram && window.Telegram.WebApp;
    if(!tg) return;
    tg.ready();
    tg.expand();
    if(tg.setHeaderColor) tg.setHeaderColor('#F6F7FA');
    if(tg.setBackgroundColor) tg.setBackgroundColor('#F6F7FA');
    if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if(tg.CloudStorage) hydrateFromCloud();
    document.addEventListener('change', function(e){
      if(e.target && e.target.matches && e.target.matches('input[type=checkbox]') && tg.HapticFeedback){
        tg.HapticFeedback.impactOccurred('light');
      }
    });
    document.addEventListener('click', function(e){
      var btn = e.target.closest && e.target.closest('.toggle, .chip, .seg-btn, .btn-primary, .day-nav-btn, .checkup-btn, .tab-btn');
      if(btn && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    });
  }catch(err){ console.warn('Telegram WebApp init skipped:', err); }
})();
</script>
