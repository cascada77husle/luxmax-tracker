<div style="font-family:'Inter',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;gap:12px">

            </sc-for>
            <sc-if value="{{b.empty}}" hint-placeholder-val="{{false}}"><span style="font-size:13px;color:var(--muted)">{{b.emptyText}}</span></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"ops":{"editor":null},"plans":{"editor":null},"tasks":{"editor":null},"habits":{"editor":null},"blocksOn":{"editor":null},"lib":{"editor":null},"vals":{"editor":null},"hist":{"editor":null},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const tasks = P.tasks || [], habits = P.habits || [], lib = P.lib || [], on = P.blocksOn || {}, hist = P.hist || {}, vals = P.vals || {}, ops = P.ops || [], plans = P.plans || [];
    const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    const progOf = (b, v) => {
      if (b.type === 'k') return v ? 100 : 0;
      if (b.type === 's') return v ? (b.lower ? (11 - v) * 10 : v * 10) : 0;
      if (b.lower) { if (b.target <= 0) return v <= 0 ? 100 : Math.max(0, 100 - v * 25); return v <= b.target ? 100 : Math.max(0, Math.round(100 - (v - b.target) / b.target * 100)); }
      return b.target > 0 ? Math.min(100, Math.round(v / b.target * 100)) : (v > 0 ? 100 : 0);
    };
    const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    // --- жизнь
    const deltas = lib.filter(b => on[b.id] && !b.live && b.type !== 't' && hist[b.id]).map(b => {
      const key = b.opts ? b.id + '_' + (vals[b.id + '_opt'] || b.opts[0]) : b.id;
      const p = hist[b.id].map(v => progOf(b, v)).concat([progOf(b, vals[key] || 0)]);
      return { b, from: Math.round(avg(p.slice(0, 3))), to: Math.round(avg(p.slice(4))) };
    }).map(d => Object.assign(d, { diff: d.to - d.from }));
    const better = deltas.filter(d => d.diff >= 10).sort((a, b) => b.diff - a.diff).slice(0, 3);
    const worse = deltas.filter(d => d.diff <= -10).sort((a, b) => a.diff - b.diff).slice(0, 3);
    const hCnt = (h) => h.days.reduce((a, b) => a + b, 0);
    const hBest = habits.filter(h => hCnt(h) >= 6), hWorst = habits.slice().sort((a, b) => hCnt(a) - hCnt(b)).filter(h => hCnt(h) <= 3).slice(0, 2);
    const overdue = tasks.filter(t => !t.done && t.day < 6);
    const doneT = tasks.filter(t => t.done).length;
    const lifeGood = hBest.map(h => ({ title: h.name, sub: 'выполнено ' + hCnt(h) + ' из 7 дней' })).concat(better.map(d => ({ title: d.b.name, sub: 'было ' + d.from + '%, стало ' + d.to + '% от цели' })));
    if (tasks.length && doneT / tasks.length >= 0.5) lifeGood.push({ title: 'Задачи', sub: 'закрыто ' + doneT + ' из ' + tasks.length });
    const lifeBad = overdue.slice(0, 3).map(t => ({ title: t.title, sub: 'просрочено, ' + t.sphere })).concat(hWorst.map(h => ({ title: h.name, sub: 'только ' + hCnt(h) + ' из 7 дней' }))).concat(worse.map(d => ({ title: d.b.name, sub: 'было ' + d.from + '%, стало ' + d.to + '% от цели' }))).slice(0, 5);
    const lifeAct = [];
    if (overdue.length) lifeAct.push({ title: 'Закрыть хвосты', sub: 'начни с «' + overdue[0].title + '», в списке «Что горит» их ' + overdue.length });
    if (hWorst[0]) lifeAct.push({ title: 'Вернуть привычку «' + hWorst[0].name + '»', sub: 'поставь её первой в утренний ритм' });
    if (worse[0]) lifeAct.push({ title: 'Подтянуть «' + worse[0].b.name + '»', sub: 'сейчас ' + worse[0].to + '% от цели' });
    if (!lifeAct.length) lifeAct.push({ title: 'Держать темп', sub: 'просадок не найдено, поднимай планку на одну привычку' });
    // --- деньги
    const NORM = 2500;
    const free = ops.filter(o => o.kind === 'out' && !o.planId);
    const dsum = (a, b) => free.filter(o => o.d >= a && o.d <= b).reduce((s, o) => s + o.sum, 0);
    const h1 = dsum(1, 9) / 9, h2 = dsum(10, 18) / 9;
    const byDay = []; for (let d = 1; d <= 18; d++) byDay.push(dsum(d, d));
    const redDays = byDay.filter(v => v > NORM).length;
    const worstD = byDay.indexOf(Math.max.apply(null, byDay));
    const big = free.slice().sort((a, b) => b.sum - a.sum)[0];
    const unpaid = plans.filter(p => !p.paid && p.day < 18);
    const income = ops.filter(o => o.kind === 'in').reduce((a, o) => a + o.sum, 0), spent = ops.filter(o => o.kind === 'out').reduce((a, o) => a + o.sum, 0);
    const monGood = [], monBad = [], monAct = [];
    if (h2 < h1) monGood.push({ title: 'Траты в день снизились', sub: 'со ' + fmt(h1) + ' до ' + fmt(h2) + ' ₽ (вторая половина месяца против первой)' });
    if (income > spent) monGood.push({ title: 'Доходы выше расходов', sub: 'остаток ' + fmt(income - spent) + ' ₽' });
    if (byDay.length - redDays >= 9) monGood.push({ title: 'Зелёных дней ' + (byDay.length - redDays), sub: 'из 18 уложился в норму ' + fmt(NORM) + ' ₽' });
    if (h2 >= h1) monBad.push({ title: 'Траты в день выросли', sub: 'со ' + fmt(h1) + ' до ' + fmt(h2) + ' ₽' });
    if (redDays) monBad.push({ title: 'Красных дней ' + redDays, sub: 'самый дорогой ' + (worstD + 1) + ' октября: ' + fmt(byDay[worstD]) + ' ₽' });
    if (big) monBad.push({ title: 'Самая крупная покупка', sub: big.note + ', ' + fmt(big.sum) + ' ₽' });
    unpaid.slice(0, 2).forEach(p => monBad.push({ title: 'Не оплачено: ' + p.name, sub: 'срок был ' + p.day + ' октября, ' + fmt(p.sum) + ' ₽' }));
    if (unpaid.length) monAct.push({ title: 'Оплатить просроченное', sub: unpaid.length + ' платежей, кнопка «Выполнено» в «Что горит»' });
    if (redDays > 2) monAct.push({ title: 'Закрепить норму ' + fmt(NORM) + ' ₽ в день', sub: 'проверяй линию трат по вечерам' });
    if (big && big.sum > NORM * 1.5) monAct.push({ title: 'Крупные покупки обдумывать сутки', sub: 'как «' + big.note + '», чтобы не бить по неделе' });
    if (!monAct.length) monAct.push({ title: 'Откладывать в первый день после дохода', sub: 'пока всё в норме, переведи часть на накопления' });
    const box = (name, bg, fg, items, emptyText) => ({ name, bg, fg, items, empty: items.length === 0, emptyText });
    return { cols: [
      { title: 'Жизнь и привычки', boxes: [box('Стало лучше', 'var(--ok-soft)', 'var(--ok)', lifeGood, 'Пока нечего отметить, внеси больше данных.'), box('Просело', 'var(--bad-soft)', 'var(--bad)', lifeBad, 'Просадок нет.'), box('Что сделать на следующей неделе', 'var(--accent-soft)', 'var(--accent-text)', lifeAct, '')] },
      { title: 'Деньги', boxes: [box('Стало лучше', 'var(--ok-soft)', 'var(--ok)', monGood, 'Пока нечего отметить.'), box('Просело', 'var(--bad-soft)', 'var(--bad)', monBad, 'Просадок нет.'), box('Что сделать на следующей неделе', 'var(--accent-soft)', 'var(--accent-text)', monAct, '')] }
    ] };
  }
}
</script>
