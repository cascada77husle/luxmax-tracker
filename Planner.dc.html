<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Расписание</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.pH{font-family:'Archivo',system-ui,sans-serif;font-size:18px;font-weight:700}
.pM{font-size:12px;color:var(--muted)}
.pCard{padding:16px;border-radius:20px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--card);box-shadow:var(--shadow)}
.pRound{cursor:pointer;width:34px;height:34px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:16px;padding:0;flex:none}
.pBtn{cursor:pointer;border:1.5px solid var(--line2);background:transparent;color:var(--ink2);font-weight:600;font-size:12px;padding:7px 14px;border-radius:999px;white-space:nowrap}
.pPri{cursor:pointer;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px;padding:10px 20px;white-space:nowrap}
.pInp{border:1.5px solid var(--line2);border-radius:14px;padding:10px 12px;font-size:14px;background:var(--field);color:var(--ink);min-width:0;box-sizing:border-box;width:100%}
.pInp[type=time],.pInp[type=date]{padding:10px 8px;font-size:13px}
.pGrid{position:relative;overflow:auto;max-height:690px;border-radius:16px}
.pCol{position:relative;border-left:1px solid var(--soft);background-image:linear-gradient(var(--soft) 1px,transparent 1px);background-size:100% 56px;background-position:0 8px;cursor:pointer}
.pEv{position:absolute;box-sizing:border-box;border-radius:12px;padding:5px 8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;border:0;color:var(--ink);font-family:inherit}
.pEv:hover{filter:brightness(1.12)}
.pCell{cursor:pointer;min-height:104px;border-radius:14px;border:1.5px solid var(--line);padding:7px 6px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;color:var(--ink);font-family:inherit}
.pChip{font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pMini{cursor:pointer;height:34px;border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:600;padding:0;position:relative;font-family:inherit}
.pChk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;box-sizing:border-box}
.pAv{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#14161c;flex:none;border:2px solid var(--card);box-sizing:border-box}
.pMod{position:fixed;inset:0;z-index:300;background:rgba(5,6,9,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.pBox{width:100%;max-width:400px;max-height:92vh;overflow:auto;border-radius:24px;background:var(--card);border:1px solid var(--line2);box-shadow:0 40px 80px -30px rgba(0,0,0,.9);padding:18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.pTag{cursor:pointer;border:1.5px solid var(--line2);background:transparent;color:var(--ink2);font-weight:600;font-size:12px;padding:6px 12px;border-radius:999px;white-space:nowrap;font-family:inherit}
.pLbl{font-size:12px;color:var(--muted);font-weight:600}
.pX{cursor:pointer;width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--muted);padding:0;display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width:700px){.pCell{min-height:56px}.pChip{display:none}}
</style>
</helmet>
<div style="font-family:'Inter',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;gap:16px">

<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
  <div style="display:flex;flex-direction:column;gap:2px"><b class="pH" style="font-size:24px">Расписание</b><span style="font-size:14px;color:var(--muted)">{{subLabel}}</span></div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <button type="button" onClick="{{prev}}" aria-label="Назад" class="pRound">‹</button><button type="button" onClick="{{today}}" class="pBtn" style="height:34px">Сегодня</button><button type="button" onClick="{{next}}" aria-label="Вперёд" class="pRound">›</button>
    <div style="display:inline-flex;gap:3px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--card)"><sc-for list="{{modes}}" as="t" hint-placeholder-count="3"><button type="button" onClick="{{t.pick}}" style="border:0;cursor:pointer;font-weight:600;font-size:13px;padding:7px 16px;border-radius:999px;white-space:nowrap;font-family:inherit;background:{{t.bg}};color:{{t.fg}}">{{t.name}}</button></sc-for></div>
    <button type="button" onClick="{{addNew}}" class="pPri">+ Событие</button>
  </div>
</div>

<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
<div style="flex:1 1 560px;min-width:0">

<sc-if value="{{isGrid}}" hint-placeholder-val="{{true}}">
  <div class="card pCard" style="padding:12px">
    <div class="pGrid">
      <div style="display:flex;position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--soft)">
        <div style="width:54px;flex:none"></div>
        <div style="flex:1;display:grid;grid-template-columns:repeat({{nCols}},minmax(0,1fr))"><sc-for list="{{cols}}" as="c" hint-placeholder-count="7"><button type="button" onClick="{{c.pick}}" style="cursor:pointer;border:0;background:transparent;color:var(--ink);padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit"><span style="font-size:12px;font-weight:600;color:var(--muted)">{{c.wd}}</span><span style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;background:{{c.bg}};color:{{c.fg}}">{{c.num}}</span></button></sc-for></div>
      </div>
      <div style="display:flex">
        <div style="width:54px;flex:none;position:relative;height:{{gridH}}px"><sc-for list="{{hours}}" as="h" hint-placeholder-count="19"><span style="position:absolute;right:8px;top:{{h.top}}px;font-size:11px;color:var(--muted);transform:translateY({{h.tr}})">{{h.t}}</span></sc-for></div>
        <div style="flex:1;display:grid;grid-template-columns:repeat({{nCols}},minmax(0,1fr))">
          <sc-for list="{{cols}}" as="c" hint-placeholder-count="7"><div class="pCol" onClick="{{c.slot}}" style="height:{{gridH}}px;background-color:{{c.tint}}">
            <div style="display:{{c.nowD}};position:absolute;left:0;right:0;top:{{c.nowTop}}px;height:0;border-top:2px solid #d98f8f;z-index:3;pointer-events:none"><span style="position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#d98f8f"></span></div>
            <sc-for list="{{c.evs}}" as="e" hint-placeholder-count="3"><button type="button" class="pEv" onClick="{{e.open}}" style="top:{{e.top}}px;height:{{e.h}}px;left:{{e.left}};width:{{e.w}};background:{{e.bg}};box-shadow:inset 3px 0 0 {{e.bar}}">
              <span style="font-size:11px;color:var(--muted);white-space:nowrap">{{e.time}}</span>
              <b style="font-size:13px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">{{e.n}}</b>
              <span style="display:{{e.locD}};font-size:11px;color:var(--ink2);align-items:center;gap:4px;white-space:nowrap;overflow:hidden"><i class="ai ai-pin" style="width:11px;height:11px"></i>{{e.loc}}</span>
              <img src="{{e.photo}}" alt="" style="display:{{e.photoD}};width:100%;height:34px;object-fit:cover;border-radius:8px;margin-top:2px">
              <span style="display:{{e.metaD}};gap:8px;align-items:center;font-size:11px;color:var(--ink2);margin-top:auto"><span style="display:{{e.lkD}};align-items:center;gap:3px"><i class="ai ai-link" style="width:11px;height:11px"></i>{{e.lk}}</span><span style="display:{{e.phD}};align-items:center;gap:3px"><i class="ai ai-image" style="width:11px;height:11px"></i>{{e.ph}}</span><span style="display:flex;margin-left:2px"><sc-for list="{{e.who}}" as="w" hint-placeholder-count="2"><span class="pAv" style="width:20px;height:20px;font-size:9px;margin-left:-5px;background:{{w.bg}}">{{w.t}}</span></sc-for></span></span>
            </button></sc-for>
          </div></sc-for>
        </div>
      </div>
    </div>
  </div>
</sc-if>

<sc-if value="{{isMonth}}" hint-placeholder-val="{{false}}">
  <div class="card pCard" style="padding:14px;gap:8px">
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px"><sc-for list="{{wdHead}}" as="h" hint-placeholder-count="7"><span style="text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0">{{h.t}}</span></sc-for></div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px"><sc-for list="{{cells}}" as="c" hint-placeholder-count="35"><button type="button" class="pCell" onClick="{{c.pick}}" style="opacity:{{c.op}};background:{{c.bg}};border-color:{{c.bd}}"><span style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px;color:var(--ink)">{{c.num}}</b><span style="font-size:10px;color:var(--muted)">{{c.cnt}}</span></span><sc-for list="{{c.chips}}" as="p" hint-placeholder-count="3"><span class="pChip" style="background:{{p.bg}};box-shadow:inset 2px 0 0 {{p.bar}}">{{p.t}}</span></sc-for><span style="display:{{c.moreD}};font-size:10px;color:var(--muted)">{{c.more}}</span></button></sc-for></div>
  </div>
</sc-if>

</div>

<div style="flex:0 1 316px;width:100%;min-width:0;display:flex;flex-direction:column;gap:14px">

  <div class="card pCard" style="padding:14px;gap:8px">
    <div style="display:flex;align-items:center;justify-content:space-between"><b class="pH" style="font-size:17px">{{mmTitle}}</b><span style="display:flex;gap:6px"><button type="button" onClick="{{mmPrev}}" aria-label="Предыдущий месяц" class="pRound" style="width:30px;height:30px">‹</button><button type="button" onClick="{{mmNext}}" aria-label="Следующий месяц" class="pRound" style="width:30px;height:30px">›</button></span></div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr))"><sc-for list="{{wdHead}}" as="h" hint-placeholder-count="7"><span style="text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0">{{h.t}}</span></sc-for></div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr))"><sc-for list="{{mini}}" as="m" hint-placeholder-count="35"><div style="background:{{m.rowBg}};border-radius:{{m.rowR}};display:flex;justify-content:center"><button type="button" class="pMini" onClick="{{m.pick}}" style="width:34px;opacity:{{m.op}}"><span style="position:absolute;inset:2px;border-radius:50%;background:{{m.bg}}"></span><span style="position:relative;color:{{m.fg}}">{{m.num}}</span><span style="position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:{{m.dot}}"></span></button></div></sc-for></div>
  </div>

  <div class="card pCard" style="gap:10px;display:{{nextD}}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:13px;color:var(--ink2)">{{nxTime}}</span><span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(182,168,224,.16);color:#c3b8ea"><i class="ai ai-clock" style="width:12px;height:12px"></i>{{nxIn}}</span></div>
    <b style="font-family:'Archivo',system-ui,sans-serif;font-size:18px;font-weight:700;line-height:1.25">{{nxName}}</b>
    <span style="display:{{nxLocD}};font-size:12px;color:var(--muted);align-items:center;gap:5px"><i class="ai ai-pin" style="width:12px;height:12px"></i>{{nxLoc}}</span>
    <div style="display:flex;gap:8px"><button type="button" onClick="{{nxLater}}" class="pBtn" style="padding:8px 18px">Позже</button><button type="button" onClick="{{nxOpen}}" class="pPri" style="padding:8px 18px;background:#b6a8e0;color:#14161c">Подробности</button></div>
  </div>

  <div class="card pCard" style="gap:10px">
    <button type="button" onClick="{{tog1}}" style="display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:var(--ink);padding:0;cursor:pointer;font-family:inherit"><b class="pH" style="font-size:16px">Мои календари</b><span style="width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate({{rot1}}deg);transition:transform .25s ease;margin:0 4px 3px 0"></span></button>
    <div style="display:{{open1}};flex-direction:column;gap:10px"><sc-for list="{{cals}}" as="k" hint-placeholder-count="2"><button type="button" onClick="{{k.pick}}" style="display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);padding:0;cursor:pointer;font-family:inherit;font-size:14px"><span class="pChk" style="background:{{k.bg}};border-color:{{k.bd}};color:#14161c">{{k.chk}}</span><span style="font-weight:500">{{k.name}}</span><span style="font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(182,168,224,.2);color:#c3b8ea">{{k.cnt}}</span></button></sc-for></div>
  </div>

  <div class="card pCard" style="gap:10px">
    <button type="button" onClick="{{tog2}}" style="display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:var(--ink);padding:0;cursor:pointer;font-family:inherit"><b class="pH" style="font-size:16px">Категории</b><span style="width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate({{rot2}}deg);transition:transform .25s ease;margin:0 4px 3px 0"></span></button>
    <div style="display:{{open2}};flex-direction:column;gap:12px"><sc-for list="{{catRows}}" as="r" hint-placeholder-count="5"><button type="button" onClick="{{r.pick}}" style="display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);padding:0;cursor:pointer;font-family:inherit;font-size:14px;opacity:{{r.op}}"><span style="width:12px;height:12px;border-radius:50%;background:{{r.col}};flex:none"></span><span style="width:74px;text-align:left;font-weight:500;flex:none">{{r.name}}</span><span style="flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden"><span style="display:block;height:100%;width:{{r.pct}}%;background:{{r.col}};border-radius:99px;transition:width .5s cubic-bezier(.22,.8,.3,1)"></span></span><span style="font-size:12px;color:var(--muted);width:16px;text-align:right">{{r.cnt}}</span></button></sc-for></div>
  </div>

</div>
</div>

<sc-if value="{{edOn}}" hint-placeholder-val="{{false}}">
<div class="pMod" onClick="{{edClose}}">
 <div class="pBox" onClick="{{stop}}">
  <div style="display:flex;justify-content:space-between;align-items:center"><b class="pH">{{edHead}}</b><button type="button" onClick="{{edClose}}" aria-label="Закрыть" class="pX"><i class="ai ai-x"></i></button></div>
  <input type="text" value="{{ed.n}}" onInput="{{fN}}" placeholder="Название события" aria-label="Название" class="pInp" style="font-weight:600;font-size:15px">
  <div style="display:flex;gap:8px"><div style="flex:1.3;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="pLbl">Дата</span><input type="date" value="{{ed.d}}" onChange="{{fD}}" aria-label="Дата" class="pInp"></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="pLbl">С</span><input type="time" step="900" value="{{ed.s}}" onChange="{{fS}}" aria-label="Начало" class="pInp"></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="pLbl">До</span><input type="time" step="900" value="{{ed.e}}" onChange="{{fE}}" aria-label="Конец" class="pInp"></div></div>
  <div style="position:relative"><i class="ai ai-pin" style="position:absolute;left:12px;top:50%;margin-top:-8px;color:var(--muted)"></i><input type="text" value="{{ed.loc}}" onInput="{{fL}}" placeholder="Место" aria-label="Место" class="pInp" style="padding-left:36px"></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{edCats}}" as="t" hint-placeholder-count="5"><button type="button" class="pTag" onClick="{{t.pick}}" style="background:{{t.bg}};color:{{t.fg}};border-color:{{t.bd}}">{{t.name}}</button></sc-for></div>
  <input type="text" value="{{ed.note}}" onInput="{{fNote}}" placeholder="Заметка" aria-label="Заметка" class="pInp">
  <div style="display:flex;flex-direction:column;gap:6px"><span class="pLbl">Ссылки</span>
    <sc-for list="{{edLinks}}" as="l" hint-placeholder-count="1"><div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:var(--field)"><i class="ai ai-link" style="color:var(--muted)"></i><a href="{{l.url}}" target="_blank" rel="noopener" style="flex:1;min-width:0;font-size:13px;color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{l.t}}</a><button type="button" onClick="{{l.rm}}" aria-label="Убрать ссылку" class="pX"><i class="ai ai-x"></i></button></div></sc-for>
    <div style="display:flex;gap:6px"><input type="text" value="{{lk}}" onInput="{{fLk}}" onKeyDown="{{lkKey}}" placeholder="Вставьте ссылку" aria-label="Ссылка" class="pInp"><button type="button" onClick="{{lkAdd}}" class="pBtn">Добавить</button></div></div>
  <div style="display:flex;flex-direction:column;gap:6px"><span class="pLbl">Фото</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><sc-for list="{{edPhotos}}" as="p" hint-placeholder-count="2"><span style="position:relative;width:64px;height:64px"><img src="{{p.src}}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:12px;display:block"><button type="button" onClick="{{p.rm}}" aria-label="Убрать фото" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;font-size:12px;padding:0;line-height:1">×</button></span></sc-for>
      <label style="cursor:pointer;width:64px;height:64px;border-radius:12px;border:1.5px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;box-sizing:border-box">+<input type="file" accept="image/*" multiple onChange="{{phPick}}" style="display:none"></label></div></div>
  <div style="display:flex;flex-direction:column;gap:6px"><span class="pLbl">Участники</span>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><sc-for list="{{edWho}}" as="w" hint-placeholder-count="2"><button type="button" onClick="{{w.rm}}" title="{{w.n}}" class="pAv" style="cursor:pointer;background:{{w.bg}};padding:0">{{w.t}}</button></sc-for><input type="text" value="{{wn}}" onInput="{{fWn}}" onKeyDown="{{wnKey}}" placeholder="Имя участника" aria-label="Участник" class="pInp" style="flex:1 1 120px;padding:7px 12px"><button type="button" onClick="{{wnAdd}}" class="pBtn">+</button></div></div>
  <span style="display:{{edErrD}};font-size:12px;color:var(--bad)">Введите название события.</span>
  <div style="display:flex;gap:8px;align-items:center;position:relative">
    <button type="button" onClick="{{edSave}}" style="flex:1;cursor:pointer;border:0;border-radius:14px;background:#0b0c10;color:#fff;font-weight:700;font-size:14px;padding:13px 20px;font-family:inherit;box-shadow:0 0 0 1px rgba(255,255,255,.25)">{{edBtn}}</button>
    <button type="button" onClick="{{menuTog}}" aria-label="Ещё" style="cursor:pointer;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line2);background:transparent;color:var(--ink);font-size:18px;font-family:inherit">⋯</button>
    <div style="display:{{menuD}};position:absolute;right:0;bottom:54px;min-width:190px;flex-direction:column;padding:6px;border-radius:16px;background:var(--card);border:1px solid var(--line2);box-shadow:0 24px 50px -20px rgba(0,0,0,.9);z-index:5"><button type="button" onClick="{{edDup}}" style="text-align:left;cursor:pointer;border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit">Копия на завтра</button><button type="button" onClick="{{edDel}}" style="text-align:left;cursor:pointer;border:0;background:transparent;color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit;display:{{delD}}">Удалить</button></div>
  </div>
 </div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":1300}}'>
class Component extends DCLogic {
  init() { return { ready: false, k: '', mode: 'week', sd: '', mm: '', ed: null, evs: [], hid: [], off: {}, catOff: {}, snz: {}, menu: false, lk: '', wn: '', ef: false, o1: true, o2: true }; }
  get L() { return (this.state && this.state.ready) ? this.state : this.init(); }
  renderVals() {
    const DEMO = !!window.__arqDemoWave, KEY = 'planner:v2' + (DEMO ? ':demo' : '');
    const load = () => { try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); return j && typeof j === 'object' ? j : {}; } catch (z) { return {}; } };
    const cur = () => { const x = this.L; return x.k === KEY ? x : Object.assign({}, x, { evs: [], hid: [] }, load(), { k: KEY }); };
